[project]
name = "citewise"
version = "1.0.0"
description = "Ask questions across your documents and get answers with verifiable, page-level citations."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.9",
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "anthropic>=1.13",
    "google-genai>=1.0",
    "structlog>=24.1",
    "slowapi>=0.1.9",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
citewise = "citewise.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["citewise*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
per-file-ignores = { "citewise/generation.py" = ["E501"], "citewise/gemini.py" = ["E501"] }  # prose prompts
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic
